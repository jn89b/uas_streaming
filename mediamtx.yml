rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

hls: false
webrtc: false
rtmp: false
srt: false

writeQueueSize: 1024

paths:

  eo:
    source: rtsp://admin:123456@192.168.1.240:8554/payload #shows both ir and normal camera feed
    rtspTransport: tcp
    sourceOnDemand: false

    runOnReadyRestart: true

  ir_cam: 
    source: rtsp://admin:123456@192.168.1.240:8554/payload_ir #only shows the ir camera feed
    sourceOnDemand: false